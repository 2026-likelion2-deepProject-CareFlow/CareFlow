plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'

}

group = 'com.careflow'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	runtimeOnly 'com.h2database:h2:2.4.240'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'


	// Source: https://mvnrepository.com/artifact/com.h2database/h2
	testImplementation("com.h2database:h2:2.4.240")

	// Quartz
	implementation 'org.springframework.boot:spring-boot-starter-quartz'

	// Mail
	implementation 'org.springframework.boot:spring-boot-starter-mail'
}

tasks.named('test') {
	useJUnitPlatform()

	// JDK 21+에서 Mockito 인라인 모킹(byte-buddy)이 에이전트를 동적으로 self-attach 하는데,
	// 기본 설정에서는 이게 막혀 MockitoInitializationException이 발생함 — 명시적으로 허용
	jvmArgs '-XX:+EnableDynamicAgentLoading'

	// Windows에서 사용자 홈 경로에 한글 등 비ASCII 문자가 포함되어 있으면
	// java.io.tmpdir(기본 %TEMP%) 경로에 있는 byte-buddy 에이전트 jar를
	// 네이티브 attach 호출이 제대로 읽지 못해 MockitoInitializationException이 발생함.
	// 프로젝트 내부(ASCII 전용 경로)의 임시 디렉토리를 강제로 사용하도록 지정.
	def testTmpDir = layout.buildDirectory.dir('tmp/test-tmp').get().asFile
	doFirst {
		testTmpDir.mkdirs()
	}
	systemProperty 'java.io.tmpdir', testTmpDir.absolutePath

	// .env 파일(REDIS_PASSWORD 등)을 테스트 실행 환경변수로 주입 — 파일 없으면 무시(CI 등)
	def envFile = rootProject.file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			line = line.trim()
			if (line && !line.startsWith('#') && line.contains('=')) {
				def idx = line.indexOf('=')
				def key = line.substring(0, idx).trim()
				def value = line.substring(idx + 1).trim()
				environment key, value
			}
		}
	}
}
