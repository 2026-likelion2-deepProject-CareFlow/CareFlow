# 테스트용 H2 DB 설정
spring:
  datasource:
    # H2 인메모리 DB 연결 주소 (테스트 데이터 격리를 위해 매번 새로 생성)
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
    # 임의의 무작위 DB 이름 생성 비활성화
    generate-unique-name: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # 테스트 실행 시마다 테이블을 새로 생성하고 종료 시 드롭
      ddl-auto: create-drop
    properties:
      hibernate:
        # 실행되는 SQL 쿼리를 콘솔에 예쁘게 출력
        show_sql: true
        format_sql: true
        # 쿼리 내의 바인딩 파라미터 값(? 표시)을 확인하기 위한 설정
        use_sql_comments: true
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            # 로컬 개발 환경: 실제 OAuth2 인증이 필요하면 Google Cloud Console에서 발급한 값으로 교체
            client-id: ${GOOGLE_CLIENT_ID:local-dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dummy-client-secret}
            scope: email, profile

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  oauth2:
    # 로컬 개발 환경용 OAuth2 로그인 성공 후 리다이렉트 URI
    redirect-uri: http://localhost:5173/oauth2/callback

jwt:
  secret: careflow-secret-key-32charslongenough!!
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

# SQL 로그 레벨 상세 설정 (파라미터 값 로깅)
logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace