spring:
  application:
    name: careflow

  datasource:
    url: jdbc:mysql://localhost:3306/careflow?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: careflow-secret-key-32charslongenough!!
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000